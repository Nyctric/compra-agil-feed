name: Diagnóstico adjuntos (temporal)

# Prueba de 30 s: ¿el servicio de adjuntos de Mercado Público bloquea a GitHub
# por IP o por no parecer un navegador? Solo se ejecuta a mano.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probar:
    runs-on: ubuntu-24.04
    steps:
      - name: Probar variantes de cabeceras
        run: |
          U="https://adjunto.mercadopublico.cl/adjunto-compra-agil/v1/adjuntos-compra-agil/listar/5036-41-COT26"
          K="user_key: 41186b85826e80d1a0d445a6ce67d1a3"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36"
          echo "País del runner: $(curl -s --max-time 10 https://ipinfo.io/country || echo '?')"
          probar() {
            nombre="$1"; shift
            code=$(curl -s -o /tmp/r.txt -w "%{http_code}" --max-time 20 "$@" "$U")
            echo "[$nombre] HTTP $code :: $(head -c 140 /tmp/r.txt | tr '\n' ' ')"
          }
          probar "A solo clave (curl)"          -H "$K"
          probar "B python-requests"            -H "$K" -A "python-requests/2.34.2"
          probar "C navegador (User-Agent)"     -H "$K" -A "$UA"
          probar "D navegador + Origin/Referer" -H "$K" -A "$UA" -H "Origin: https://buscador.mercadopublico.cl" -H "Referer: https://buscador.mercadopublico.cl/"
          probar "E solo Origin/Referer"        -H "$K" -H "Origin: https://buscador.mercadopublico.cl" -H "Referer: https://buscador.mercadopublico.cl/"
          echo "--- control: API del buscador (misma red) ---"
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 -H "x-api-key: e93089e4-437c-4723-b343-4fa20045e3bc" "https://api.buscador.mercadopublico.cl/compra-agil?action=ficha&code=5036-41-COT26")
          echo "[buscador ficha] HTTP $code"
