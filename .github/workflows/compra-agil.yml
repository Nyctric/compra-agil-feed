name: Compra Agil — recolector

# Corre una vez al día a las 10:00 hora Chile (UTC-4 verano / UTC-3 invierno).
# 14:00 UTC = 10:00 Chile verano. En invierno serían las 11:00.
on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch: {}   # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  recolectar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar recolector
        env:
          MP_TICKET: ${{ secrets.MP_TICKET }}
        run: python compra_agil_collector.py

      - name: Commit del JSON si cambió
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add oportunidades.json
          if git diff --staged --quiet; then
            echo "Sin cambios en oportunidades.json"
          else
            git commit -m "Actualiza oportunidades Compra Ágil ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi

# trigger
