name: Compra Agil — recolector

# Corre una vez al día a las 10:00 hora Chile (UTC-4 verano / UTC-3 invierno).
# 14:00 UTC = 10:00 Chile verano. En invierno serían las 11:00.
on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch: {}  # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  recolectar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historial completo: permite rebase si master avanzó durante la corrida

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar recolector
        env:
          MP_TICKET: ${{ secrets.MP_TICKET }}
          # Opcional: si está definido, la evaluación IA (Haiku) corre aquí y
          # queda cacheada en eval_ia.json — la app no gasta tokens al abrir.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.ANTROPIC_API_KEY }}
        run: python compra_agil_collector.py

      - name: Commit del JSON y adjuntos si cambiaron
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Guardar los archivos generados fuera del repo
          mkdir -p /tmp/salida
          cp oportunidades.json /tmp/salida/ 2>/dev/null || true
          if [ -f eval_ia.json ]; then cp eval_ia.json /tmp/salida/; fi
          if [ -f precios_historicos.json ]; then cp precios_historicos.json /tmp/salida/; fi
          if [ -d adjuntos ]; then cp -r adjuntos /tmp/salida/; fi
          # Commit sobre master SIEMPRE actualizado: sin rebase, sin conflictos posibles
          for i in 1 2 3 4 5; do
            git fetch origin master
            git reset --hard origin/master
            rm -rf adjuntos
            cp /tmp/salida/oportunidades.json . 2>/dev/null || true
            if [ -f /tmp/salida/eval_ia.json ]; then cp /tmp/salida/eval_ia.json .; fi
            if [ -f /tmp/salida/precios_historicos.json ]; then cp /tmp/salida/precios_historicos.json .; fi
            if [ -d /tmp/salida/adjuntos ]; then cp -r /tmp/salida/adjuntos .; fi
            git add -A oportunidades.json
            if [ -f eval_ia.json ]; then git add -A eval_ia.json; fi
            if [ -f precios_historicos.json ]; then git add -A precios_historicos.json; fi
            git add -A adjuntos 2>/dev/null || true
            if git diff --staged --quiet; then
              echo "Sin cambios"
              exit 0
            fi
            git commit -m "Actualiza oportunidades y adjuntos Compra Ágil ($(date -u +%Y-%m-%dT%H:%MZ))"
            if git push; then
              echo "Push OK"
              exit 0
            fi
            echo "Push rechazado (intento $i) — reintentando desde master actualizado…"
            sleep 5
          done
          echo "No se pudo subir tras varios intentos" >&2
          exit 1
