name: Compra Agil — recolector

# Corre una vez al día a las 10:00 hora Chile (UTC-4 verano / UTC-3 invierno).
# 14:00 UTC = 10:00 Chile verano. En invierno serían las 11:00.
on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch: {}  # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  recolectar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar recolector
        env:
          MP_TICKET: ${{ secrets.MP_TICKET }}
          # Opcional: si está definido, la evaluación IA (Haiku) corre aquí y
          # queda cacheada en eval_ia.json — la app no gasta tokens al abrir.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python compra_agil_collector.py

      - name: Commit del JSON y adjuntos si cambiaron
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A oportunidades.json
          if [ -f eval_ia.json ]; then git add -A eval_ia.json; fi
          if [ -d adjuntos ]; then git add -A adjuntos; fi
          if git diff --staged --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "Actualiza oportunidades y adjuntos Compra Ágil ($(date -u +%Y-%m-%dT%H:%MZ))"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push OK"
              exit 0
            fi
            echo "Push rechazado (intento $i) — actualizando con rebase…"
            git fetch origin master
            git rebase origin/master
          done
          echo "No se pudo subir tras varios intentos" >&2
          exit 1
