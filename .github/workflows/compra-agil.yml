name: Compra Agil — recolector

# Domingo a viernes a las 21:07 hora de Chile continental (America/Santiago).
# (minuto 07 y no 00: GitHub atrasa más los disparos que caen justo en punto)
# El domingo cubre lo publicado el fin de semana que cierra el lunes.
# GitHub solo entiende UTC y Chile cambia de horario dos veces al año:
#   horario de verano  (UTC-3, sept → abril): 21:07 = 00:07 UTC del día siguiente
#   horario de invierno (UTC-4, abril → sept): 21:07 = 01:07 UTC del día siguiente
# Por eso hay dos disparos y el job "horario" deja pasar solo el que corresponde
# a la fecha. Domingo-viernes en Chile = lunes-sábado en UTC (1-6).
on:
  schedule:
    - cron: "7 0 * * 1-6"   # verano
    - cron: "7 1 * * 1-6"   # invierno
  workflow_dispatch: {}  # a mano (o desde ContaApp): corre siempre, sin mirar la hora

permissions:
  contents: write

# Nunca dos corridas a la vez: la segunda espera a que termine la primera.
concurrency:
  group: compra-agil
  cancel-in-progress: false

jobs:
  horario:
    runs-on: ubuntu-24.04   # fijo: ubuntu-latest pasa a 26 el 19-10-2026
    outputs:
      correr: ${{ steps.decidir.outputs.correr }}
    steps:
      - name: ¿Corresponde este disparo?
        id: decidir
        env:
          DISPARO: ${{ github.event.schedule }}
          EVENTO: ${{ github.event_name }}
        run: |
          if [ "$EVENTO" != "schedule" ]; then
            echo "Ejecución manual: corre." ; echo "correr=true" >> "$GITHUB_OUTPUT" ; exit 0
          fi
          # Se decide por el disparo, no por la hora real: GitHub suele atrasar los
          # cron varios minutos y a las 00:05 ya sería "otro día".
          OFFSET=$(TZ=America/Santiago date +%z)
          if [ "$OFFSET" = "-0300" ]; then ESPERADO="7 0 * * 1-6"; else ESPERADO="7 1 * * 1-6"; fi
          if [ "$DISPARO" = "$ESPERADO" ]; then
            echo "Chile en UTC${OFFSET}: corresponde '$DISPARO'. Corre."
            echo "correr=true" >> "$GITHUB_OUTPUT"
          else
            echo "Chile en UTC${OFFSET}: hoy corresponde '$ESPERADO', no '$DISPARO'. Se omite."
            echo "correr=false" >> "$GITHUB_OUTPUT"
          fi

  recolectar:
    needs: horario
    if: needs.horario.outputs.correr == 'true'
    runs-on: ubuntu-24.04   # fijo: ubuntu-latest pasa a 26 el 19-10-2026
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # historial completo: permite rebase si master avanzó durante la corrida

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar recolector
        env:
          # Sin esto Python retiene la salida y el log muestra todo con la hora
          # de término: no se puede ver en vivo en qué etapa va ni cuánto tarda cada una.
          PYTHONUNBUFFERED: "1"
          MP_TICKET: ${{ secrets.MP_TICKET }}
          # Opcional: si está definido, la evaluación IA (Haiku) corre aquí y
          # queda cacheada en eval_ia.json — la app no gasta tokens al abrir.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.ANTROPIC_API_KEY }}
          # Opcional: aviso diario por Telegram con finalistas y resultados
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Opcional: aviso por correo (Gmail con contraseña de aplicación)
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python compra_agil_collector.py

      - name: Commit del JSON y adjuntos si cambiaron
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Guardar los archivos generados fuera del repo
          mkdir -p /tmp/salida
          cp oportunidades.json /tmp/salida/ 2>/dev/null || true
          if [ -f eval_ia.json ]; then cp eval_ia.json /tmp/salida/; fi
          if [ -f triage_ia.json ]; then cp triage_ia.json /tmp/salida/; fi
          if [ -f precios_historicos.json ]; then cp precios_historicos.json /tmp/salida/; fi
          if [ -f resultados.json ]; then cp resultados.json /tmp/salida/; fi
          if [ -d adjuntos ]; then cp -r adjuntos /tmp/salida/; fi
          # Commit sobre master SIEMPRE actualizado: sin rebase, sin conflictos posibles
          for i in 1 2 3 4 5; do
            git fetch origin master
            git reset --hard origin/master
            rm -rf adjuntos
            cp /tmp/salida/oportunidades.json . 2>/dev/null || true
            if [ -f /tmp/salida/eval_ia.json ]; then cp /tmp/salida/eval_ia.json .; fi
            if [ -f /tmp/salida/triage_ia.json ]; then cp /tmp/salida/triage_ia.json .; fi
            if [ -f /tmp/salida/precios_historicos.json ]; then cp /tmp/salida/precios_historicos.json .; fi
            if [ -f /tmp/salida/resultados.json ]; then cp /tmp/salida/resultados.json .; fi
            if [ -d /tmp/salida/adjuntos ]; then cp -r /tmp/salida/adjuntos .; fi
            git add -A oportunidades.json
            if [ -f eval_ia.json ]; then git add -A eval_ia.json; fi
            if [ -f triage_ia.json ]; then git add -A triage_ia.json; fi
            if [ -f precios_historicos.json ]; then git add -A precios_historicos.json; fi
            if [ -f resultados.json ]; then git add -A resultados.json; fi
            git add -A adjuntos 2>/dev/null || true
            if git diff --staged --quiet; then
              echo "Sin cambios"
              exit 0
            fi
            git commit -m "Actualiza oportunidades y adjuntos Compra Ágil ($(date -u +%Y-%m-%dT%H:%MZ))"
            if git push; then
              echo "Push OK"
              exit 0
            fi
            echo "Push rechazado (intento $i) — reintentando desde master actualizado…"
            sleep 5
          done
          echo "No se pudo subir tras varios intentos" >&2
          exit 1
